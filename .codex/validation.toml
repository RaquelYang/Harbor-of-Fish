[validation]
required = ["test", "lint", "build"]

# Reference command argv values for a Codex plan validating this orchestrator.
# The runner executes the validation_commands embedded in each plan JSON.

[commands.test]
argv = ["python3", "-m", "unittest", "discover", "-s", ".codex/orchestrator", "-p", "test_*.py"]

[commands.lint]
argv = ["python3", "-c", "from pathlib import Path; compile(Path('.codex/orchestrator/run.py').read_text(encoding='utf-8'), '.codex/orchestrator/run.py', 'exec')"]

[commands.build]
argv = ["python3", "-c", "from pathlib import Path; [compile(path.read_text(encoding='utf-8'), str(path), 'exec') for path in Path('.codex/orchestrator').glob('*.py')]"]

# First-stage application candidates from specs/001-local-fullstack-skeleton/quickstart.md.
# These remain unverified until the frontend/backend skeleton exists and each command runs.
[commands.frontend_test]
argv = ["npm", "--prefix", "frontend", "test", "--", "--watch=false"]

[commands.frontend_lint]
argv = ["npm", "--prefix", "frontend", "run", "lint"]

[commands.frontend_build]
argv = ["npm", "--prefix", "frontend", "run", "build"]

[commands.backend_checkstyle]
argv = ["./mvnw", "-f", "backend/pom.xml", "checkstyle:check"]

[commands.backend_verify]
argv = ["./mvnw", "-f", "backend/pom.xml", "verify"]
